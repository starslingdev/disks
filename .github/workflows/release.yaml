name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One lock covers PR maintenance and publication, including manual retries.
concurrency:
  group: disks-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      !github.event.repository.fork &&
      github.repository == 'starslingdev/disks' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ts.yaml
    permissions:
      contents: read

  release-pr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changelog PR/contributor links need the history of changeset files.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      # App-created commits/PRs trigger ordinary pull_request CI; GITHUB_TOKEN writes do not.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app.outputs.token }}
          version-script: pnpm release:version
          pr-title: 'chore: release Disks'
          commit-message: 'chore: release Disks'
          create-github-releases: false
          push-git-tags: false

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Node runs TypeScript directly. No dependency installation or compilation in this job.
      - name: Publish validated action
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release.ts
